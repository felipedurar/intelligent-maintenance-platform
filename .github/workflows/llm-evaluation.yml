name: LLM Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ragas:
    name: RAGAS And Judge Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || {
            echo "OPENAI_API_KEY GitHub secret is required for RAGAS evaluation." >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start evaluation dependencies
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: docker compose up -d --build postgres qdrant mlflow

      - name: Index RAG documentation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: docker compose run --rm --no-deps prefect-worker ./scripts/run_rag_indexing.sh

      - name: Run required RAGAS metrics
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: docker compose run --rm --no-deps prefect-worker ./scripts/run_ragas_evaluation.sh --mlflow

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-evaluation-reports
          path: |
            evaluation/reports/agent_eval_latest.json
            evaluation/reports/agent_eval_latest.md

      - name: Stop services
        if: always()
        run: docker compose down
