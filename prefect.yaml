name: datathon-ai-platform
prefect-version: "3"

build: null
push: null

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

deployments:
  - name: initial-ai4i-dataset
    entrypoint: src/ingestion/flows.py:ingest_initial_ai4i_dataset
    work_pool:
      name: datathon-local
      work_queue_name: default
    parameters:
      csv_path: data/raw/ai4i2020.csv
      processed_dir: data/processed
    tags:
      - ingestion
      - ai4i
      - initial

  - name: incoming-ai4i-batches
    entrypoint: src/ingestion/flows.py:ingest_incoming_ai4i_batches
    work_pool:
      name: datathon-local
      work_queue_name: default
    parameters:
      incoming_dir: data/incoming
      archive_dir: data/archive
      processed_dir: data/processed
    tags:
      - ingestion
      - ai4i
      - incoming

  - name: train-ai4i-failure-classifier
    entrypoint: src/training/train_model.py:train_ai4i_failure_classifier
    work_pool:
      name: datathon-local
      work_queue_name: default
    tags:
      - training
      - ai4i
      - mlflow

  - name: index-rag-documentation
    entrypoint: src/rag/flows.py:index_rag_documentation
    work_pool:
      name: datathon-local
      work_queue_name: default
    parameters:
      base_dir: .
    tags:
      - rag
      - indexing
      - openai

  - name: detect-ai4i-drift
    entrypoint: src/monitoring/flows.py:detect_ai4i_drift
    work_pool:
      name: datathon-local
      work_queue_name: default
    parameters:
      reference_path: data/reference/ai4i_reference.csv
      current_path: data/processed/ai4i_features_latest.csv
      report_dir: reports/drift
    tags:
      - monitoring
      - drift
      - psi
