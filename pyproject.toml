[project]
name = "datathon-ai-platform"
version = "0.1.0"
description = "Cloud AI platform for predictive maintenance with AI4I 2020"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "joblib>=1.4.0,<2.0.0",
    "mlflow>=2.17.0,<3.0.0",
    "openai>=1.60.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "prefect>=3.0.0,<4.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "psycopg2-binary>=2.9.10,<3.0.0",
    "qdrant-client>=1.12.0,<2.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.10,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.8.0,<1.0.0",
]
eval = [
    "datasets>=3.0.0,<4.0.0",
    "ragas>=0.2.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/ingestion/flows.py",
    "src/ingestion/repository.py",
    "src/rag/flows.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
allow_untyped_decorators = true
check_untyped_defs = false
no_strict_optional = true
disable_error_code = [
    "arg-type",
    "attr-defined",
    "import-untyped",
    "union-attr",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
