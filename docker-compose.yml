services:
  platform_api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: datathon-platform-api
    ports:
      - "8080:8000"
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://datathon:datathon@postgres:5432/datathon
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-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}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      QDRANT_URL: http://qdrant:6333
      RAG_COLLECTION_NAME: datathon_docs
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - ./src:/app/src:ro
    command: uvicorn platform_api.main:app --host 0.0.0.0 --port 8000 --reload

  prefect-server:
    image: prefecthq/prefect:3-python3.12
    container_name: datathon-prefect-server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_UI_URL: http://localhost:4200
      PREFECT_API_URL: http://127.0.0.1:4200/api
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://datathon:datathon@postgres:5432/prefect
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  prefect-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: datathon-prefect-worker
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://datathon:datathon@postgres:5432/datathon
      PREFECT_API_URL: http://prefect-server:4200/api
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-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}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      QDRANT_URL: http://qdrant:6333
      RAG_COLLECTION_NAME: datathon_docs
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
      qdrant:
        condition: service_started
      prefect-server:
        condition: service_started
      prefect-deployments:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    command: >
      sh -c "until prefect work-pool ls >/dev/null 2>&1; do
      echo 'Waiting for Prefect API...'; sleep 2; done
      && prefect work-pool create --type process datathon-local || true
      && prefect worker start --pool datathon-local"

  prefect-deployments:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: datathon-prefect-deployments
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_WORK_POOL: datathon-local
    depends_on:
      prefect-server:
        condition: service_started
    command: ./scripts/register_prefect_deployments.sh

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: datathon-mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://datathon:datathon@postgres:5432/mlflow
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    volumes:
      - mlflow_artifacts:/mlflow/artifacts

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: datathon-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    container_name: datathon-postgres
    environment:
      POSTGRES_DB: datathon
      POSTGRES_USER: datathon
      POSTGRES_PASSWORD: datathon
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datathon -d datathon"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-init:
    image: postgres:16-alpine
    container_name: datathon-postgres-init
    environment:
      PGPASSWORD: datathon
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "psql -h postgres -U datathon -d datathon -tAc
      \"select 1 from pg_database where datname = 'prefect'\"
      | grep -q 1
      || createdb -h postgres -U datathon prefect;
      psql -h postgres -U datathon -d datathon -tAc
      \"select 1 from pg_database where datname = 'mlflow'\"
      | grep -q 1
      || createdb -h postgres -U datathon mlflow"

volumes:
  postgres_data:
  mlflow_artifacts:
  qdrant_data:
